<html>
<html lang="es">
<head>
    <meta charset="UTF-8">

</head>
<body>
  <h1>Formularios en html</h1>
  <form>
        <span>Usuario:</span>
        <input type="text" name="usuario" placeholder="">
        <br>
        
        <span>Contraseña:</span>
        <input type="password" name="contraseña" >
        <br>

        <span>Correo electrónico:</span>
        <input type="email" name="correo" >
        <br>

        <span>  Telefono:</span>
        <input type="tel" name="telefono" >
        <br>

        <span>Edad: </span>
        <input type="number" name="edad" min="0" max ="120">
        <br>

        <span>Fecha de nacimiento:</span>
        <input type="date" name="fecha_nacimiento" max="2026-09-07" >
        <br>

        <span>Color preferido:</span>
        <input type="color" name="color_preferido" >
        <br>

        <span>Desea recibir notificaciones y promociones?</span>
        <input type="checkbox" name="notificaciones" >
        <br>

        <span>Archivo:</span>
        <input type="file" name="archivo" >
        <br>

        <span>Sexo:</span>
        <br>
        Masculino <input type="radio" name="sexo" value="masculino"> 
        <br>
        Femenino <input type="radio" name="sexo" value="femenino"> 
        <br>
        Otro <input type="radio" name="sexo" value="otro"> 
        <br>

        <span>Rango preferido:</span>
        <input type="range" name="rango" min="0" max="100">
        <br>

        <span>Medidor de avance:</span>
        <meter name="medidor" min="0" max="100" value="50"></meter>
        <br>

        <button type="submit">Enviar</button>

  </form>




</body>
</html>
