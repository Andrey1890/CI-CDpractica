name: Auditoria CI/CD

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    name: Auditoria del proyecto
    runs-on: [self-hosted, Windows, X64, auditor]
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Revisar archivos sensibles
        shell: pwsh
        run: |
          $patterns = @('*.env', '*.pem', '*.key', '*id_rsa*', '*secret*')
          $matches = Get-ChildItem -Recurse -Force -File -ErrorAction SilentlyContinue |
            Where-Object { $name = $_.Name; $patterns | Where-Object { $name -like $_ } }
          if ($matches) {
            $matches | ForEach-Object { Write-Error "Archivo sensible detectado: $($_.FullName)" }
            exit 1
          }

      - name: Revisar configuracion basica
        shell: pwsh
        run: |
          $required = @('README.md')
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Warning "Faltan archivos recomendados: $($missing -join ', ')"
          }

      - name: Punto de extension para configuracion futura
        shell: pwsh
        run: Write-Output 'Modo actual: auditoria. La configuracion automatica se habilitara en un workflow separado.'
